<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top, #020617, #000);
      color: white;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* SIDEBAR */
    .sidebar {
      width: 220px;
      backdrop-filter: blur(20px);
      background: rgba(255,255,255,0.03);
      padding: 20px;
      border-right: 1px solid rgba(255,255,255,0.08);
    }

    .sidebar h2 {
      color: #22d3ee;
      font-weight: 600;
    }

    .menu {
      margin-top: 30px;
    }

    .menu div {
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      color: #94a3b8;
    }

    .menu div:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    /* MAIN */
    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .search {
      width: 300px;
      padding: 12px;
      border-radius: 20px;
      border: none;
      background: rgba(255,255,255,0.05);
      color: white;
      backdrop-filter: blur(10px);
    }

    .grid {
      margin-top: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
      gap: 20px;
    }

    /* CARD */
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      padding: 12px;
      transition: 0.3s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 20px rgba(34,211,238,0.2);
    }

    .thumb {
      height: 130px;
      border-radius: 10px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .btns {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent;
      color: white;
      padding: 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #22d3ee;
      color: black;
    }

    /* RIGHT PANEL */
    .panel {
      width: 320px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border-left: 1px solid rgba(255,255,255,0.08);
      padding: 20px;
      transform: translateX(100%);
      transition: 0.3s;
    }

    .panel.active {
      transform: translateX(0);
    }

      .folder-card, .file-title { color: inherit; font: inherit; text-align: left; border: 0; }
    .file-title { display: block; width: 100%; padding: 10px 0; background: transparent; cursor: pointer; overflow-wrap: anywhere; }
    .folder-card { cursor: pointer; }
  </style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>Drive</h2>

  <div class="menu">
    <div onclick="load()">All Files</div>
    <div>Recent</div>
    <div>Starred</div>
    <div>Trash</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <input class="search" placeholder="Search...">

  <div class="grid" id="files"></div>
</div>

<!-- RIGHT PANEL -->
<div class="panel" id="panel">
  <h3 id="pname"></h3>
  <iframe id="preview" style="width:100%;height:200px;"></iframe>
</div>

<script>
let currentFolder = null;

function previewUrl(id) {
  return typeof id === "string" && /^[A-Za-z0-9_-]+$/.test(id)
    ? "https://drive.google.com/file/d/" + encodeURIComponent(id) + "/preview" : null;
}

function load(folderId = null) {
  google.script.run.withSuccessHandler(render).getFiles(folderId);
}

function makeButton(label, action, className = "btn") {
  const button = document.createElement("button");
  button.type = "button";
  button.className = className;
  button.textContent = label;
  button.addEventListener("click", action);
  return button;
}

function renderEntries(data) {
  const grid = document.getElementById("files");
  grid.replaceChildren();
  data.folders.forEach(folder => {
    const button = makeButton("📁 " + String(folder.name), () => load(folder.id), "card folder-card");
    grid.appendChild(button);
  });
  data.files.forEach(file => {
    const card = document.createElement("article");
    card.className = "card";
    const url = previewUrl(file.id);
    const name = String(file.name);
    const thumb = document.createElement("div");
    thumb.className = "thumb";
    if (url) {
      const frame = document.createElement("iframe");
      frame.src = url;
      frame.title = "Preview of " + name;
      frame.loading = "lazy";
      thumb.appendChild(frame);
    }
    const title = makeButton(name, () => openPreview(name, url), "file-title");
    title.disabled = !url;
    const actions = document.createElement("div");
    actions.className = "btns";
    const open = makeButton("Open", () => window.open(url, "_blank", "noopener,noreferrer"));
    open.disabled = !url;
    actions.append(open, makeButton("Rename", () => renameFile(file.id)), makeButton("Move to trash", () => deleteFile(file.id)));
    card.append(thumb, title, actions);
    grid.appendChild(card);
  });
}

function render(data) {
  currentFolder = data.id;
  renderEntries(data);
}

function openPreview(name, url) {
  if (!url) return;
  document.getElementById("panel").classList.add("active");
  document.getElementById("pname").textContent = name;
  document.getElementById("preview").src = url;
}

function deleteFile(id) {
  if (confirm("Move this file to Google Drive Trash?")) {
    google.script.run.withSuccessHandler(() => load(currentFolder)).deleteFile(id);
  }
}

function renameFile(id) {
  const name = prompt("New name:");
  if (name && name.trim()) {
    google.script.run.withSuccessHandler(() => load(currentFolder)).renameFile(id, name.trim());
  }
}

load();
</script>

</body>
</html>
